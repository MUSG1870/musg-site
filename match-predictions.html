
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Predictions | MUSG</title>
  <meta name="description" content="Submit your Maidenhead United match prediction with MUSG.">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .predictions-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 35px 20px 50px;
    }

    .predictions-page h1 {
      text-align: center;
      margin-bottom: 12px;
    }

    .predictions-intro {
      text-align: center;

    }

    .prediction-frame {
      width: 100%;
      height: 760px;
      border: 0;
      border-radius: 8px;
      background: #fff;

    @media (max-width: 600px) {
      .predictions-page {

      .prediction-frame {

<body>

    </p>

    <iframe
      class="prediction-frame"
      src="https://script.google.com/macros/s/AKfycbz-rcg57_-0JlYnJ9yiLz2Js1EUayT2ZB4NWbXkU3EDi-45fUeVFsUmGEVQfQ8LwKDR/exec"

</html>
